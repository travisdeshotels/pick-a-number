[project]
name = "terminal-ui"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "terminal-libs",
    "terminal-helper",
    "requests"
]

[tool.uv.sources]
terminal-libs = {workspace = true}
terminal-helper = {workspace = true}

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"
